<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1116">
<title>MLB Live Bets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1116;
  --surface:#131C24;
  --surface-2:#1A252F;
  --chalk:#E8E3D9;
  --muted:#7C8A97;
  --line:#22303B;
  --amber:#F2A93B;
  --green:#3FCF8E;
  --clay:#D2544B;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:Inter,system-ui,sans-serif;
  font-size:15px;
  line-height:1.45;
  padding:0 0 40px;
  /* Tiza sobre tierra: un halo tenue de reflector arriba */
  background-image:radial-gradient(120% 60% at 50% -10%, #16232D 0%, var(--ink) 60%);
  background-attachment:fixed;
}

/* ---------- Encabezado ---------- */
.top{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:22px 18px 14px;
}
.top h1{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:30px;letter-spacing:.02em;
  text-transform:uppercase;
}
.top .sub{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- Tarjeta de apuesta ---------- */
.ticket{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  margin:0 14px 14px;
  overflow:hidden;
}
/* Cabecera de la apuesta: identidad y total. Los partidos van adentro,
   en cada grupo, porque una combinada cruza varios juegos. */
.ticket__top{
  display:flex;align-items:center;gap:9px;
  padding:12px 15px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
}
.ticket__title{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:19px;letter-spacing:.02em;text-transform:uppercase;
}
.ticket__tally{
  margin-left:auto;font-family:'Barlow Condensed',sans-serif;
  font-size:16px;font-weight:600;color:var(--muted);
}
.ticket__tally b{color:var(--green);font-size:18px}
.pay{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
  color:var(--amber);font-variant-numeric:tabular-nums;
}
.warn{
  padding:9px 15px;font-size:12.5px;color:var(--amber);
  background:rgba(242,169,59,.07);border-bottom:1px solid var(--line);
}

/* Grupo = un partido dentro de la apuesta */
.group{border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group__head{
  padding:10px 15px 9px;
  background:rgba(255,255,255,.015);
}
.group__head .matchup{font-size:17px}
.group__head .score{font-size:17px}
.group__head .logo{width:19px;height:19px}
.subodds{
  color:var(--amber);font-variant-numeric:tabular-nums;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;
}
.subodds::before{content:"· "}

.ticket__head{
  padding:13px 15px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
}
.matchup{
  display:flex;align-items:center;gap:8px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:20px;font-weight:600;letter-spacing:.01em;
}
.matchup .at{color:var(--muted);font-size:14px}
.logo{
  width:22px;height:22px;object-fit:contain;flex:none;
  /* Los escudos oscuros se pierden sobre el fondo: un halo tenue los separa */
  filter:drop-shadow(0 0 1px rgba(232,227,217,.35));
}
.team{display:inline-flex;align-items:center;gap:6px}
.bet__title{font-family:'Barlow Condensed',sans-serif;font-size:20px;
  font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.bet__odds{margin-left:auto;font-family:'Barlow Condensed',sans-serif;
  font-size:20px;font-weight:700;color:var(--amber);
  font-variant-numeric:tabular-nums}
.group{border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.group__head{padding:11px 15px 10px;background:rgba(255,255,255,.02)}
.group__odds{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip{
  background:var(--amber);color:#1B1206;font-weight:700;font-size:12px;
  padding:2px 8px;border-radius:20px;margin-right:8px;flex:none;
  font-family:Inter,sans-serif;letter-spacing:.02em;
}
.score{
  font-variant-numeric:tabular-nums;font-weight:700;
  font-size:20px;margin-left:auto;letter-spacing:.04em;
}
.meta{
  display:flex;align-items:center;gap:9px;
  margin-top:5px;color:var(--muted);font-size:12px;
}
.pulse{
  width:6px;height:6px;border-radius:50%;background:var(--clay);
  box-shadow:0 0 0 0 rgba(210,84,75,.7);
  animation:beat 2s infinite;
}
@keyframes beat{
  70%{box-shadow:0 0 0 7px rgba(210,84,75,0)}
  100%{box-shadow:0 0 0 0 rgba(210,84,75,0)}
}
.ticket__head{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ticket__head:active{opacity:.85}
/* Sacar una apuesta a mano: útil sobre todo con las ya perdidas, sin
   esperar a que se borren solas. */
.quitar{
  border:none;background:transparent;color:var(--muted);
  font-size:17px;line-height:1;cursor:pointer;padding:0 2px;margin-left:6px;
  opacity:.5;
}
.quitar:hover{opacity:1;color:var(--clay)}
.chevron{
  display:inline-block;color:var(--muted);font-size:15px;line-height:1;
  transition:transform .15s ease;margin-left:4px;
}
.ticket.is-collapsed .chevron{transform:rotate(-90deg)}
.ticket.is-collapsed .ticket__body{display:none}
/* Calibración: bloque discreto al pie, solo visible cuando hay datos */
.tabs{display:flex;gap:6px;margin:0 15px 14px}
.tab{
  flex:1;padding:8px;border:1px solid var(--line);background:transparent;
  color:var(--muted);border-radius:7px;font-size:12.5px;cursor:pointer;
  font-family:inherit;
}
.tab.activa{color:var(--chalk);border-color:var(--muted)}
.pgroup{margin:0 14px 12px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pgroup__head{
  display:flex;justify-content:space-between;padding:9px 13px;
  background:var(--surface-2);font-size:12.5px;font-weight:600;
}
.pgroup__head span{color:var(--muted);font-weight:400}
.pick{display:flex;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--line);cursor:pointer}
.pick input{accent-color:var(--green);width:17px;height:17px;flex:none}
.pick__txt{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px}
.pick__txt em{color:var(--muted);font-style:normal;font-size:11.5px}
.pick__num{font-size:13px;color:var(--green);font-variant-numeric:tabular-nums;text-align:right}
.pick__num small{display:block;color:var(--muted);font-size:10.5px}
.carrito{
  position:sticky;bottom:0;display:flex;justify-content:space-between;
  align-items:center;gap:10px;margin:0 14px 14px;padding:11px 14px;
  border-radius:var(--r);background:var(--surface-2);
  border:1px solid var(--line);font-size:12.5px;
}
.carrito.ok .carrito__prob{color:var(--green)}
.carrito.medio .carrito__prob{color:var(--amber)}
.carrito.mal .carrito__prob{color:var(--clay)}
.carrito__prob{font-weight:600}
.carrito__cuota{color:var(--amber);font-weight:600}
/* Barra de avance de la combinada */
.tbar{display:flex;align-items:center;gap:9px;padding:8px 15px 10px}
.tbar__pista{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.tbar__pista i{
  display:block;height:100%;border-radius:3px;background:var(--green);
  transition:width .4s ease;
}
.tbar.mal .tbar__pista i{background:var(--clay);opacity:.45}
.tbar.fin .tbar__pista i{background:var(--muted)}
.tbar__txt{font-size:11px;color:var(--muted);flex:none;letter-spacing:.02em}
.tbar.mal .tbar__txt{color:var(--clay)}
.creditos{
  text-align:center;font-size:10.5px;color:var(--muted);
  opacity:.6;margin:2px 0 16px;letter-spacing:.03em;
}
.creditos.bajo{color:var(--amber);opacity:1}
.acciones{display:flex;gap:8px;margin:0 15px 12px}
.accion{
  flex:1;text-align:center;padding:9px;border:1px dashed var(--line);
  border-radius:7px;color:var(--muted);font-size:12.5px;cursor:pointer;
}
.accion:active{border-color:var(--muted);color:var(--chalk)}
.mejorar{
  border:none;background:transparent;font-size:14px;cursor:pointer;
  padding:0 2px;margin-left:6px;opacity:.55;
}
.mejorar:hover{opacity:1}
.mejora{padding:11px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.mejora__head{
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-bottom:7px;
}
.mtramo{font-size:12.5px;line-height:1.5;margin-bottom:3px}
.mtramo.mal{color:var(--clay)}
.mtramo.ok{color:var(--green)}
.mtramo i{color:var(--muted);font-style:normal;font-size:11px}
.mejora__tot{margin-top:7px;font-size:12.5px;color:var(--chalk)}
.fuentes{display:flex;gap:6px;flex-wrap:wrap;margin:0 14px 12px}
.ftag{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font-size:11.5px;padding:4px 10px;border-radius:20px;cursor:pointer;
  font-family:inherit;
}
.ftag.activa{color:var(--chalk);border-color:var(--muted)}
.ftag i{font-style:normal;margin-left:5px;opacity:.5;padding:0 2px}
.ftag i:hover{opacity:1;color:var(--clay)}
.msg__head .quitar{margin-left:6px;font-size:15px}
.msg{margin:0 14px 10px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r)}
.panel-fuentes{margin:0 14px 18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel-fuentes__head{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 15px;cursor:pointer;font-size:13.5px;
}
.panel-fuentes__lista{border-top:1px solid var(--line)}
.fuente-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 15px;border-bottom:1px solid var(--line);
}
.fuente-row:last-child{border-bottom:none}
.fuente-row__info{display:flex;flex-direction:column;gap:4px;min-width:0}
.fuente-row__info b{font-size:14px;line-height:1.3}
.fuente-row__grupo{font-size:11.5px;color:var(--muted)}
.fuente-row__filtros{font-size:11px;color:var(--muted);opacity:.75;margin-top:1px}
.fuente-row__filtros--alerta{color:var(--clay,#f88);opacity:1;font-weight:600}
.fuente-row__quitar{
  flex-shrink:0;background:none;border:1px solid var(--line);color:var(--clay,#f88);
  font-size:11px;padding:7px 12px;border-radius:20px;cursor:pointer;font-family:inherit;
}
.fuente-row--grupo{display:flex;flex-direction:column;gap:8px}
.fuente-row__cabecera{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fuente-row__quitar-chica{
  flex-shrink:0;background:none;border:none;color:var(--muted);
  font-size:10.5px;cursor:pointer;font-family:inherit;text-decoration:underline;
  text-underline-offset:2px;padding:0;
}
.autor-chips{display:flex;flex-wrap:wrap;gap:6px}
.autor-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;
  border:1px solid var(--line);border-radius:20px;padding:5px 8px 5px 11px;
}
.autor-chip i{
  font-style:normal;color:var(--clay,#f88);cursor:pointer;font-size:13px;
  line-height:1;padding:0 2px;
}
#panelFuentes{margin-bottom:6px}
.grupo-sep{
  margin:6px 14px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);opacity:.7;display:flex;justify-content:space-between;align-items:center;
}
.grupo-sep__borrar{
  background:none;border:none;color:var(--clay,#f88);font-size:10.5px;
  letter-spacing:normal;text-transform:none;cursor:pointer;font-family:inherit;
  padding:2px 0;opacity:.85;
}
.fuentes{margin-top:4px}
.msg__foto{display:block;max-width:100%;border-radius:8px;margin:2px 0 8px;cursor:zoom-in}
.msg__txt a{color:var(--acc,#7dd3fc);word-break:break-all}
.msg__head{display:flex;gap:8px;align-items:baseline;font-size:11.5px;margin-bottom:6px;flex-wrap:wrap}
.msg__head b{font-size:12.5px}
.msg__head span{color:var(--muted)}
.msg__head i:not(.quitar){color:var(--muted);font-style:normal;opacity:.7}
.msg__txt{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.son{margin:0 14px 12px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.son__head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 13px;background:var(--surface-2);
}
.son__n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  text-transform:uppercase;letter-spacing:.04em}
.son__cuota{color:var(--amber);font-weight:700;font-size:16px}
.son__prob{padding:7px 13px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line)}
.son__prob.ok{color:var(--green)}
.son__prob.medio{color:var(--amber)}
.son__prob.mal{color:var(--clay)}
.son__aviso{padding:6px 13px;font-size:11.5px;color:var(--amber);
  background:rgba(242,169,59,.07);border-bottom:1px solid var(--line)}
.son__leg{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line)}
.son__leg:last-child{border-bottom:none}
.son__jug{flex:1;display:flex;flex-direction:column;gap:1px;font-size:13px}
.son__jug em{color:var(--muted);font-style:normal;font-size:11.5px}
.son__jug i{color:var(--muted);font-style:normal;font-size:10.5px;opacity:.75}
.son__num{font-size:13px;color:var(--green);text-align:right;font-variant-numeric:tabular-nums}
.son__num small{display:block;color:var(--muted);font-size:10.5px}
.editable{cursor:pointer}
.sincuota{text-decoration:underline dotted;text-underline-offset:3px}
.cuotas{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  margin:18px 15px 0;font-size:11px;color:var(--muted);
}
.cuota b{color:var(--chalk);font-weight:600}
.cuota.poca b{color:var(--amber)}
.cuota.agotada b{color:var(--clay)}
.calib{margin:22px 15px 0;padding-top:16px;border-top:1px solid var(--line)}
.calhead{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
}
.calsub{font-size:12px;color:var(--muted);margin:3px 0 10px;line-height:1.4}
.calfila{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.callabel{font-size:11px;color:var(--muted);width:58px;flex:none;font-variant-numeric:tabular-nums}
.calbar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.calbar i{display:block;height:100%;background:var(--green);border-radius:3px}
.calbar i.mal{background:var(--clay)}
.calval{font-size:11px;color:var(--muted);width:64px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.calval small{opacity:.6}
/* Combinada rota: se apaga sin desaparecer, para no confundirla con
   una que sigue viva. */
.ticket.is-dead{opacity:.55}
.ticket.is-dead .tally b{color:var(--clay)}
.final.dead{color:var(--clay);border-color:var(--clay)}
.pronto{color:var(--amber);font-size:11.5px}
.final.draft{color:var(--amber);border-color:var(--amber)}
/* Barra del borrador: se decide acá mismo si se jugó o se descarta. */
.draftbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 15px;font-size:12px;color:var(--amber);
  background:rgba(242,169,59,.07);border-bottom:1px solid var(--line);
}
.draftbtns{display:flex;gap:6px;flex:none}
.dbtn{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font-size:11.5px;padding:3px 9px;border-radius:5px;cursor:pointer;
}
.dbtn.ok{color:var(--green);border-color:var(--green)}
.dbtn.no{color:var(--muted)}
.dbtn:disabled{opacity:.5;cursor:default}

/* Cuando un ticket tiene varios partidos, cada uno queda indentado y con
   un borde lateral -señal de que son PIEZAS de una sola apuesta, no
   combinadas sueltas colgando una al lado de la otra. */
.ticket__body.multi{
  margin-left:10px;
  border-left:2px solid var(--line);
}
.ticket__body.multi .group{margin-left:4px}
.gpart{
  display:block;color:var(--muted);font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;
}
.tally{
  margin-left:auto;font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:600;letter-spacing:.03em;color:var(--chalk);
}
.tally b{color:var(--green)}

/* ---------- Grupo: un partido dentro de la apuesta ---------- */
.group{border-top:1px solid var(--line)}
.group:first-of-type{border-top:0}
.group__head{
  padding:10px 15px 9px;
  background:rgba(255,255,255,.018);
}
.group__teams{
  display:flex;align-items:center;gap:7px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:17px;font-weight:600;letter-spacing:.01em;
}
.gscore{
  margin-left:auto;font-variant-numeric:tabular-nums;
  font-weight:700;font-size:17px;letter-spacing:.03em;
}
.group__meta{
  display:flex;align-items:center;gap:8px;
  margin-top:3px;color:var(--muted);font-size:11.5px;
}
.godds{
  color:var(--chalk);font-variant-numeric:tabular-nums;
  background:var(--surface-2);padding:1px 6px;border-radius:4px;
}
.gtally{
  margin-left:auto;font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:600;color:var(--muted);
}
.tname{
  font-family:'Barlow Condensed',sans-serif;font-size:19px;
  font-weight:600;letter-spacing:.02em;text-transform:uppercase;
}

/* ---------- Cada selección ---------- */
/* Cabecera de la apuesta: identidad y total. Los partidos van adentro,
   en cada grupo, porque una combinada cruza varios juegos. */
.ticket__top{
  display:flex;align-items:center;gap:9px;
  padding:12px 15px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
}
.ticket__title{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:19px;letter-spacing:.02em;text-transform:uppercase;
}
.ticket__tally{
  margin-left:auto;font-family:'Barlow Condensed',sans-serif;
  font-size:16px;font-weight:600;color:var(--muted);
}
.ticket__tally b{color:var(--green);font-size:18px}
.pay{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
  color:var(--amber);font-variant-numeric:tabular-nums;
}
.warn{
  padding:9px 15px;font-size:12.5px;color:var(--amber);
  background:rgba(242,169,59,.07);border-bottom:1px solid var(--line);
}

/* Grupo = un partido dentro de la apuesta */
.group{border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group__head{
  padding:10px 15px 9px;
  background:rgba(255,255,255,.015);
}
.group__head .matchup{font-size:17px}
.group__head .score{font-size:17px}
.group__head .logo{width:19px;height:19px}
.subodds{
  color:var(--amber);font-variant-numeric:tabular-nums;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;
}
.subodds::before{content:"· "}

.ticket__head{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ticket__num{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  display:block;margin-bottom:3px;
}
.caret{
  margin-left:8px;color:var(--muted);font-size:11px;
  transition:transform .25s ease;display:inline-block;
}
.ticket.cerrado .caret{transform:rotate(-90deg)}
.ticket.cerrado .legs{display:none}
.aviso{
  margin:0 15px 12px;padding:8px 10px;border-radius:8px;
  background:rgba(210,84,75,.12);border:1px solid rgba(210,84,75,.3);
  color:var(--clay);font-size:12px;
}
.leg{padding:13px 34px 15px 22px;border-bottom:1px solid var(--line)}
.group .leg:last-child{border-bottom:0}
.leg__top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.player{font-weight:600;font-size:15px;letter-spacing:-.01em}
.odds{
  margin-left:auto;color:var(--muted);font-size:12px;
  font-variant-numeric:tabular-nums;
}
.market{color:var(--muted);font-size:13px;margin-bottom:14px}

/* Barra: la pista, la burbuja del valor y el objetivo al final */
.track{position:relative;height:3px;background:var(--line);border-radius:2px;margin:0 0 4px}
.fill{
  position:absolute;inset:0 auto 0 0;height:100%;border-radius:2px;
  background:var(--amber);
  width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1);
}
.bubble{
  position:absolute;top:50%;
  transform:translate(-50%,-50%) scale(.6);
  opacity:0;
  background:var(--amber);color:#1B1206;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:14px;line-height:1;letter-spacing:.02em;
  padding:5px 9px;border-radius:20px;
  font-variant-numeric:tabular-nums;
  transition:left 1.1s cubic-bezier(.22,1,.36,1),transform .5s ease .3s,opacity .4s ease .3s;
  white-space:nowrap;
}
.goal{
  position:absolute;left:100%;top:50%;transform:translateY(-50%);
  margin-left:10px;color:var(--muted);
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;
  font-variant-numeric:tabular-nums;
}
.leg.is-live .bubble,.leg.is-done .bubble,.leg.is-dead .bubble{opacity:1;transform:translate(-50%,-50%) scale(1)}
.leg.is-done .fill{background:var(--green)}
.leg.is-done .bubble{background:var(--green);color:#04150C}
.leg.is-done .goal{color:var(--green)}
.leg.is-dead .fill{background:var(--clay)}
.leg.is-dead .bubble{background:var(--clay);color:#1B0705}
.leg.is-good .fill{background:var(--green)}
.leg.is-good .bubble{background:var(--green);color:#04150C}
.leg.is-mid .fill{background:var(--amber)}
.leg.is-bad .fill{background:var(--clay)}
.leg.is-bad .bubble{background:var(--clay);color:#1B0705}
.leg.is-lost .fill{background:var(--clay)}
.leg.is-lost .bubble{background:var(--clay);color:#1B0705}
.leg.is-lost .goal{color:var(--clay);font-size:16px}
.leg.is-lost .player{text-decoration:line-through;text-decoration-color:var(--clay);opacity:.75}
.leg.is-done .goal{font-size:16px}
.final{
  color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
  font-size:10.5px;border:1px solid var(--line);
  padding:1px 6px;border-radius:4px;
}
.leg.is-unknown .fill{background:var(--line)}
.leg.is-unknown .bubble{background:var(--line);color:var(--muted)}
.leg.is-warn .fill{background:var(--amber)}
.leg.is-warn .bubble{background:var(--amber);color:#1B0705}
.empty{
  margin:34px 18px;padding:26px 20px;text-align:center;
  border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);
}
.empty b{display:block;color:var(--chalk);font-family:'Barlow Condensed',sans-serif;
  font-size:20px;font-weight:600;margin-bottom:6px}
.note{
  font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.note.warn{color:var(--clay)}
.note.good{color:var(--green)}
.legbottom{
  margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.masbtn{
  flex:none;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font-size:14px;line-height:1;cursor:pointer;padding:0;
}
.masbtn:hover{border-color:var(--muted);color:var(--chalk)}
.detalle{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.detalle__msg{color:var(--muted);font-size:12.5px;margin:0}
.detalle__resumen{margin:0 0 8px;font-size:12.5px;color:var(--chalk);font-weight:600}
.detalle__tabla{display:flex;flex-direction:column;gap:4px}
.detalle__fila{
  display:grid;grid-template-columns:1fr auto auto;gap:10px;
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.detalle__fila.hit{color:var(--green)}
.turnos{margin-top:4px;font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.sug{
  margin-top:5px;font-size:12px;color:var(--amber);
  opacity:.95;line-height:1.35;
}
.detalle__sug{
  margin:8px 0;padding:7px 9px;border-radius:6px;font-size:12.5px;
  color:var(--amber);background:rgba(242,169,59,.09);
}
.detalle__alts{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.alt{
  font-size:11px;color:var(--muted);border:1px solid var(--line);
  padding:2px 7px;border-radius:12px;font-variant-numeric:tabular-nums;
}
.alt b{color:var(--chalk);margin-left:5px;font-weight:600}
.alt.es-tuya{border-color:var(--green);color:var(--green)}
.alt.es-tuya b{color:var(--green)}
.chance{color:var(--chalk);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- Pie ---------- */
.foot{padding:6px 18px;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.6}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .bubble{opacity:1;transform:translate(-50%,-50%)}
}
</style>
</head>
<body>

<header class="top">
  <h1>Mis apuestas</h1>
  <span class="sub">En vivo</span>
</header>

<nav class="tabs">
  <button class="tab activa" data-vista="apuestas" onclick="cambiarVista('apuestas')">Mis apuestas</button>
  <button class="tab" data-vista="armar" onclick="cambiarVista('armar')">Armar</button>
  <button class="tab" data-vista="sonadoras" onclick="cambiarVista('sonadoras')">Soñadoras</button>
  <button class="tab" data-vista="grupo" onclick="cambiarVista('grupo')">Grupo</button>
</nav>
<div class="acciones">
  <label class="accion">
    <input type="file" accept="image/*" multiple hidden onchange="subirCapturas(this,false)">
    📸 Subir captura
  </label>
  <label class="accion">
    <input type="file" accept="image/*" multiple hidden onchange="subirCapturas(this,true)">
    🧪 Probar sin guardar
  </label>
</div>
<p id="subiendo" class="foot" hidden></p>
<main id="app"></main>
<main id="armar" hidden>
  <p class="foot" id="armarEstado">Cargando picks…</p>
  <div id="listaPicks"></div>
</main>
<div id="carrito" class="carrito" hidden></div>
<main id="grupo" hidden>
  <div id="panelFuentes"></div>
  <div class="grupo-sep">
    Mensajes
    <button class="grupo-sep__borrar" onclick="borrarTodosLosMensajes()">Borrar todos</button>
  </div>
  <p class="foot" id="grupoEstado">Cargando…</p>
  <div id="listaMensajes"></div>
</main>
<main id="sonadoras" hidden>
  <p class="foot" id="sonEstado">Buscando soñadoras…</p>
  <div id="listaSonadoras"></div>
</main>

<div id="cuotas" class="cuotas" hidden></div>
<section id="calibracion" class="calib" hidden></section>
<p class="foot" id="foot">Cargando…</p>
<p id="creditos" class="creditos" hidden></p>

<script>
const KEY = new URLSearchParams(location.search).get('k') || '';
const REFRESCO_MS = 30000;   // el boxscore de MLB no cambia más rápido que esto
const app  = document.getElementById('app');
const foot = document.getElementById('foot');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]
));

function leg(l){
  const pct  = Math.max(0, Math.min(100, Number(l.pct) || 0));
  const meta = [l.market, l.line].filter(Boolean).join(' · ');
  // En vivo el objetivo es un número; ya cumplida, un tilde.
  const goal = l.state === 'done' ? '✓'
             : (l.state === 'lost' ? '✗' : esc(l.goal ?? ''));
  const notaClase = l.state === 'done' || l.state === 'good' ? 'good'
                  : (l.state === 'dead' || l.state === 'bad' || l.state === 'warn' ? 'warn' : '');
  const params = new URLSearchParams({
    k: KEY, player: l.player ?? '', market: l.market ?? '', line: l.line ?? '',
  }).toString();
  return `
    <div class="leg is-${esc(l.state)}" data-pct="${pct}">
      <div class="leg__top">
        <span class="player">${esc(l.player)}</span>
        ${l.odds ? `<span class="odds">${esc(l.odds)}</span>` : ''}
      </div>
      <div class="market">${esc(meta)}</div>
      <div class="track">
        <div class="fill"></div>
        <div class="bubble">${esc(l.current ?? 0)}</div>
        <span class="goal">${goal}</span>
      </div>
      <div class="legbottom">
        <div>
          ${l.note ? `<div class="note ${notaClase}">${esc(l.note)}</div>` : ''}
          ${l.sugerencia ? `<div class="sug">💡 ${esc(l.sugerencia)}</div>` : ''}
          ${l.turnos ? `<div class="turnos">⚾ ${esc(l.turnos)}</div>` : ''}
        </div>
        <button class="masbtn" data-detail-url="/api/leg-detail?${esc(params)}"
                onclick="toggleDetalle(this)" aria-label="Ver más de ${esc(l.player)}">+</button>
      </div>
      <div class="detalle" hidden></div>
    </div>`;
}

async function toggleDetalle(btn){
  const leg = btn.closest('.leg');
  const panel = leg.querySelector('.detalle');

  if (!panel.hidden) { panel.hidden = true; btn.textContent = '+'; return; }

  if (panel.dataset.cargado !== '1') {
    panel.hidden = false;
    panel.innerHTML = '<p class="detalle__msg">Buscando...</p>';
    try {
      const r = await fetch(btn.dataset.detailUrl, {cache: 'no-store'});
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'error');
      const filas = (d.games || []).map(g => `
        <div class="detalle__fila ${g.hit ? 'hit' : ''}">
          <span>${esc(g.date || '—')}</span>
          <span>${esc(g.value)}</span>
          <span>${g.hit ? '✓' : '·'}</span>
        </div>`).join('');
      const sug = d.sugerencia
        ? `<p class="detalle__sug">💡 Te convenía <b>${esc(d.sugerencia.side)} ${esc(d.sugerencia.linea)}</b>
             — ${esc(d.sugerencia.pct)}% igual, y paga más</p>`
        : '';
      const alts = (d.alternativas || []).length
        ? `<div class="detalle__alts">
             ${(d.alternativas).map(a => `
               <span class="alt ${a.apostada ? 'es-tuya' : ''}">
                 ${esc(a.side)} ${esc(a.linea)}<b>${esc(a.pct)}%</b>
               </span>`).join('')}
           </div>`
        : '';
      panel.innerHTML = `
        <p class="detalle__resumen">
          ${esc(d.probability_pct)}% de ${(d.games || []).length} partidos ·
          promedio ${esc(d.avg_value)}
        </p>
        ${sug}
        ${alts}
        <div class="detalle__tabla">${filas || '<p class="detalle__msg">Sin partidos recientes</p>'}</div>`;
      panel.dataset.cargado = '1';
    } catch (e) {
      panel.innerHTML = `<p class="detalle__msg">No se pudo traer el detalle (${esc(e.message)})</p>`;
    }
  } else {
    panel.hidden = false;
  }
  btn.textContent = '−';
}

function equipo(nombre, logo){
  const img = logo ? `<img class="logo" src="${esc(logo)}" alt="" loading="lazy"
                        onerror="this.remove()">` : '';
  return `<span class="team">${img}${esc(nombre)}</span>`;
}

// Un grupo = las selecciones de UN partido dentro de la apuesta. Es la
// misma jerarquía que muestra la casa: apuesta -> partidos -> selecciones.
function grupo(g, indice, total){
  const marcador = (g.away_score ?? null) !== null
    ? `<span class="gscore">${esc(g.away_score)} – ${esc(g.home_score)}</span>` : '';

  const estado = g.terminado
    ? `<span class="final">Final</span>`
    : (g.live && g.inning
        ? `<span class="pulse"></span> ${esc(g.inning)}ª ${esc(g.inning_state || '')}`
        : (g.por_empezar
            ? `<span class="pronto">Por empezar</span>${g.start ? ` · ${esc(g.start)}` : ''}`
          : (g.start ? `🕐 ${esc(g.start)}` : '')));

  const cuota = g.odds ? `<span class="godds">${esc(g.odds)}</span>` : '';
  const parte = total > 1 ? `<span class="gpart">Parte ${indice + 1} de ${total}</span>` : '';

  return `
    <div class="group">
      <div class="group__head">
        ${parte}
        <div class="group__teams">
          ${equipo(g.away, g.away_logo)}
          <span class="at">@</span>
          ${equipo(g.home, g.home_logo)}
          ${marcador}
        </div>
        <div class="group__meta">
          ${estado}
          ${cuota}
          <span class="gtally">${esc(g.done)}/${esc(g.total)}</span>
        </div>
      </div>
      ${(g.legs || []).map(leg).join('')}
    </div>`;
}

const _colapsoManual = new Map();

function claveTicket(t, i){
  const primerMatch = (t.grupos && t.grupos[0] && t.grupos[0].match) || '';
  return [t.label || '', t.odds || '', primerMatch, t.total, i].join('|');
}

function ticket(t, i){
  const grupos = t.grupos || [];
  // Solo la cuota abre el editor. Antes el clic estaba en toda la
  // línea, así que tocar para desplegar el ticket abría el diálogo de
  // cuota sin querer.
  const editar = `onclick="event.stopPropagation();`
    + `editarCuota('${esc(t.id)}','${esc(t.odds || '')}')"`;
  const cuota = t.odds
    ? `<span class="editable" ${editar}>Paga <b>${esc(t.odds)}</b></span>`
    : `<span class="editable sincuota" ${editar}>Sin cuota leída</span>`;
  const etiqueta = t.label ? `<span class="chip">${esc(t.label)}</span>` : '';
  const tramos = t.declaradas && t.declaradas != t.total
    ? `${esc(t.total)} de ${esc(t.declaradas)} tramos leídos`
    : `${esc(t.total)} tramos`;

  const clave = claveTicket(t, i);
  // Colapsados por default. Con varias apuestas de 10 tramos, abrir
  // todo de entrada llena la pantalla y hay que scrollear para ver qué
  // hay. La cabecera ya muestra el avance; el detalle se abre al tocar.
  const colapsado = _colapsoManual.has(clave) ? _colapsoManual.get(clave) : true;

  return `
    <section class="ticket ${colapsado ? 'is-collapsed' : ''} ${t.caida && !t.terminado ? 'is-dead' : ''}" data-clave="${esc(clave)}">
      <div class="ticket__head" onclick="toggleTicket(this.closest('.ticket'))">
        <div class="matchup">
          ${etiqueta}<span class="tname">${tramos}</span>
          <span class="tally"><b>${esc(t.done)}</b> de ${esc(t.total)}</span>
        </div>
        <div class="meta">
          ${cuota} · ${esc(grupos.length)} ${grupos.length === 1 ? 'partido' : 'partidos'}
          ${t.borrador ? '<span class="final draft">Borrador</span>' : ''}
          ${t.terminado ? '<span class="final">Terminada</span>'
            : (t.caida ? '<span class="final dead">Ya no puede darse</span>' : '')}
          <span class="chevron">⌄</span>
          <button class="mejorar" title="Versión segura"
                  onclick="event.stopPropagation();verMejora('${esc(t.id)}',this)">🛡</button>
          <button class="quitar" title="Sacar de la lista"
                  onclick="event.stopPropagation();accionTicket('${esc(t.id)}','descartar',this)">×</button>
        </div>
      </div>
      ${t.borrador ? `
        <div class="draftbar">
          <span>Todavía no la jugaste</span>
          <span class="draftbtns">
            <button class="dbtn ok" onclick="accionTicket('${esc(t.id)}','jugada',this)">La jugué</button>
            <button class="dbtn no" onclick="accionTicket('${esc(t.id)}','descartar',this)">Descartar</button>
          </span>
        </div>` : ''}
      ${_barraTicket(t)}
      <div class="ticket__body ${grupos.length > 1 ? 'multi' : ''}">
        ${grupos.map((g, idx) => grupo(g, idx, grupos.length)).join('')}
      </div>
    </section>`;
}

async function accionTicket(id, accion, btn){
  if (accion === 'descartar' && !confirm('¿Descartar este borrador?')) return;
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const r = await fetch(
      `/api/ticket-accion?k=${encodeURIComponent(KEY)}&id=${encodeURIComponent(id)}&accion=${accion}`,
      {cache: 'no-store'}
    );
    if (!r.ok) throw new Error('error');
    await cargar();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = accion === 'jugada' ? 'La jugué' : 'Descartar';
    alert('No se pudo aplicar el cambio.');
  }
}

function actualizarCabecera(r){
  if (!r || !r.legs_totales) {
    document.title = 'MLB Live Bets';
    const vacio = document.querySelector('.top .sub');
    if (vacio) vacio.textContent = 'EN VIVO';
    return;
  }

  // Título de la pestaña: con el celular en otra app o la pestaña de
  // fondo, esto solo ya dice cómo viene todo sin abrir nada.
  document.title = r.legs_totales
    ? `${r.legs_cumplidas}/${r.legs_totales} · MLB`
    : 'MLB Live Bets';

  const sub = document.querySelector('.top .sub');
  if (!sub) return;
  const partes = [];
  if (r.legs_totales) partes.push(`${r.legs_cumplidas} de ${r.legs_totales} tramos`);
  if (r.en_vivo) partes.push(`${r.en_vivo} en vivo`);
  if (r.caidas) partes.push(`${r.caidas} caída${r.caidas > 1 ? 's' : ''}`);
  sub.textContent = partes.join(' · ') || 'EN VIVO';
}

// --- Calibración ------------------------------------------------------
// Al pie y solo si hay datos: comparar lo predicho contra lo que pasó se
// entiende de un vistazo como barras, y es ilegible como lista.
let _calibracionCargada = false;

// Créditos de las APIs de cuotas. Cuando se agotan dejan de andar las
// soñadoras y la pestaña Armar, y hasta ahora había que acordarse de
// preguntarle al bot con /proveedor.
function mostrarCuotas(cuotas){
  const cont = document.getElementById('cuotas');
  if (!cont || !cuotas) return;

  const nombres = {parlay: 'ParlayAPI', theodds: 'The Odds API'};
  const partes = Object.entries(cuotas)
    .filter(([k]) => nombres[k])
    .map(([k, v]) => {
      const clase = v <= 0 ? 'agotada' : (v < 50 ? 'poca' : '');
      const txt = v <= 0 ? 'agotada' : `${v}`;
      return `<span class="cuota ${clase}">${nombres[k]}: <b>${esc(txt)}</b></span>`;
    });

  if (!partes.length) return;
  cont.innerHTML = partes.join('');
  cont.hidden = false;
}

async function cargarCalibracion(){
  if (_calibracionCargada) return;
  const cont = document.getElementById('calibracion');
  if (!cont) return;

  try {
    const r = await fetch(`/api/calibracion?k=${encodeURIComponent(KEY)}`, {cache:'no-store'});
    if (!r.ok) return;
    const d = await r.json();
    mostrarCuotas(d.cuotas);

    const res = d.resumen || {};
    if (!res.total) return;  // sin datos, ni se muestra

    _calibracionCargada = true;
    const dif = (res.prob_media || 0) - (res.real_pct || 0);
    const veredicto = res.total < 20
      ? `Con ${res.total} legs todavía no significa nada`
      : (dif > 7 ? 'El modelo promete de más'
        : (dif < -7 ? 'El modelo es conservador' : 'El modelo está bien calibrado'));

    const barras = (d.tramos || []).map(t => {
      const ancho = Math.max(2, Math.min(100, t.real_pct));
      const flojo = t.predicho_medio - t.real_pct > 10 && t.muestra >= 5;
      return `
        <div class="calfila">
          <span class="callabel">${esc(t.tramo)}</span>
          <span class="calbar"><i style="width:${ancho}%" class="${flojo ? 'mal' : ''}"></i></span>
          <span class="calval">${esc(t.real_pct)}%<small> (${esc(t.muestra)})</small></span>
        </div>`;
    }).join('');

    cont.innerHTML = `
      <div class="calhead">Calibración · ${esc(res.total)} legs resueltas</div>
      <div class="calsub">Predije ${esc(res.prob_media)}% · pasó el ${esc(res.real_pct)}% — ${esc(veredicto)}</div>
      ${barras}`;
    cont.hidden = false;
  } catch (e) {
    // Es información extra: si falla, la página sigue igual.
  }
}

// --- Vista de armado --------------------------------------------------
// Tildás picks y abajo se calcula la combinada en vivo. Los picks vienen
// cacheados 10 minutos del lado del servidor: sin eso cada visita
// dispararía un barrido completo.
const _seleccion = new Map();
let _picksCargados = false;

function cambiarVista(cual){
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('activa', b.dataset.vista === cual));
  document.getElementById('app').hidden = cual !== 'apuestas';
  document.getElementById('armar').hidden = cual !== 'armar';
  document.getElementById('sonadoras').hidden = cual !== 'sonadoras';
  document.getElementById('grupo').hidden = cual !== 'grupo';
  document.getElementById('foot').hidden = cual !== 'apuestas';
  document.getElementById('carrito').hidden = cual !== 'armar' || _seleccion.size === 0;
  if (cual === 'armar') cargarPicks();
  if (cual === 'sonadoras') cargarSonadoras();
  if (cual === 'grupo') cargarMensajes();
}

async function cargarPicks(){
  if (_picksCargados) return;
  const estado = document.getElementById('armarEstado');
  // La primera vez del día puede tardar: barre la casa de apuestas y
  // consulta la MLB API por cada jugador. Decirlo evita que parezca
  // colgado.
  estado.textContent = 'Buscando picks del día… puede tardar hasta un minuto la primera vez.';
  try {
    const r = await fetch(`/api/picks?k=${encodeURIComponent(KEY)}`, {cache:'no-store'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'error');

    if (!(d.picks || []).length) {
      estado.textContent = 'Hoy no hay picks con ventaja detectable.';
      return;
    }
    _picksCargados = true;
    estado.hidden = true;

    // Agrupados por partido, igual que las apuestas.
    const porPartido = {};
    d.picks.forEach(p => (porPartido[p.match] = porPartido[p.match] || []).push(p));

    document.getElementById('listaPicks').innerHTML =
      Object.entries(porPartido).map(([partido, picks]) => `
        <div class="pgroup">
          <div class="pgroup__head">${esc(partido)}<span>${esc(picks[0].hora)}</span></div>
          ${picks.map(p => `
            <label class="pick">
              <input type="checkbox" onchange="togglePick(this,'${esc(p.id)}',${p.odds},${p.prob})">
              <span class="pick__txt">
                <b>${esc(p.player)}</b>
                <em>${esc(p.market)} · ${esc(p.line)}</em>
              </span>
              <span class="pick__num">${esc(p.prob)}%<small>@${esc(p.odds)}</small></span>
            </label>`).join('')}
        </div>`).join('');
  } catch (e) {
    estado.textContent = 'No pude traer los picks.';
  }
}

function togglePick(input, id, odds, prob){
  if (input.checked) _seleccion.set(id, {odds, prob});
  else _seleccion.delete(id);
  actualizarCarrito();
}

function actualizarCarrito(){
  const caja = document.getElementById('carrito');
  const n = _seleccion.size;
  if (!n) { caja.hidden = true; return; }

  let cuota = 1, prob = 1;
  _seleccion.forEach(p => { cuota *= p.odds; prob *= p.prob / 100; });
  // Misma penalización por dependencia que usa el bot: los tramos
  // comparten día y condiciones, no son independientes.
  prob *= Math.pow(0.97, n - 1);

  const pct = (prob * 100);
  const color = pct >= 40 ? 'ok' : (pct >= 20 ? 'medio' : 'mal');
  caja.className = `carrito ${color}`;
  caja.hidden = false;
  caja.innerHTML = `
    <span class="carrito__n">${n} tramo${n > 1 ? 's' : ''}</span>
    <span class="carrito__prob">${pct.toFixed(1)}% de que entren todas</span>
    <span class="carrito__cuota">paga ${cuota.toFixed(2)}x</span>`;
}

// --- Subir capturas desde la web -------------------------------------
// Con esto la web deja de depender de Telegram para cargar una apuesta.
async function subirCapturas(input, borrador){
  const archivos = Array.from(input.files || []);
  input.value = '';
  if (!archivos.length) return;

  const aviso = document.getElementById('subiendo');
  aviso.hidden = false;
  aviso.textContent = `Leyendo ${archivos.length} captura${archivos.length > 1 ? 's' : ''}…`;

  try {
    const imagenes = await Promise.all(archivos.map(a => new Promise((ok, mal) => {
      const fr = new FileReader();
      fr.onload = () => ok(fr.result);
      fr.onerror = mal;
      fr.readAsDataURL(a);
    })));

    const r = await fetch(`/api/captura?k=${encodeURIComponent(KEY)}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({imagenes, borrador}),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || d.detail || 'no pude leerla');

    aviso.textContent = `Listo: ${d.legs} tramos en ${d.tickets} apuesta(s)`
      + (borrador ? ' · guardada como borrador' : '');
    await cargar();
    setTimeout(() => { aviso.hidden = true; }, 4000);
  } catch (e) {
    aviso.textContent = 'No pude leerla: ' + e.message;
  }
}

// --- Versión segura desde la web -------------------------------------
async function verMejora(id, btn){
  const original = btn.textContent;
  btn.textContent = '…';
  try {
    const r = await fetch(`/api/mejorar?k=${encodeURIComponent(KEY)}&id=${encodeURIComponent(id)}`,
                          {cache:'no-store'});
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || d.detail || 'error');

    const filas = d.tramos.map(t => {
      if (t.no_alcanza) return `<div class="mtramo mal">❌ <b>${esc(t.player)}</b> — `
        + `ni con ${esc(t.linea_nueva)} pasa del ${esc(t.prob)}% · <i>sacala</i></div>`;
      if (t.cambio) return `<div class="mtramo ok">🟢 <b>${esc(t.player)}</b> — `
        + `${esc(t.linea_original)} → <b>${esc(t.linea_nueva)}</b> · ${esc(t.prob)}%</div>`;
      return `<div class="mtramo">✅ <b>${esc(t.player)}</b> — `
        + `${esc(t.linea_nueva)} · ${esc(t.prob)}% <i>(ya estaba bien)</i></div>`;
    }).join('');

    const ticket = btn.closest('.ticket');
    let panel = ticket.querySelector('.mejora');
    if (!panel) {
      panel = document.createElement('div');
      panel.className = 'mejora';
      ticket.appendChild(panel);
    }
    panel.innerHTML = `
      <div class="mejora__head">Versión segura · objetivo ${esc(d.objetivo)}% por tramo</div>
      ${filas}
      ${d.combinada != null
        ? `<div class="mejora__tot">Que entren todas: <b>${esc(d.combinada)}%</b></div>`
        : '<div class="mejora__tot">Ningún tramo llega al objetivo.</div>'}`;
  } catch (e) {
    alert('No pude analizarla: ' + e.message);
  } finally {
    btn.textContent = original;
  }
}

// Barra de avance de la combinada: cuántos tramos se dieron sobre el
// total. Es lo primero que uno quiere saber y hasta ahora había que
// leer el "3 de 8" y hacer la cuenta mental.
function _barraTicket(t){
  const total = t.total || 0;
  if (!total) return '';

  const hechos = t.done || 0;
  const faltan = total - hechos;
  const pct = Math.round(hechos / total * 100);

  // Rota: no importa cuánto avanzó, ya no puede darse.
  const estado = t.caida ? 'mal' : (t.terminado ? 'fin' : 'viva');
  const texto = t.caida
    ? 'Ya no puede darse'
    : (faltan === 0 ? '¡Se dio entera!'
      : `Faltan ${faltan} tramo${faltan > 1 ? 's' : ''}`);

  return `
    <div class="tbar ${estado}">
      <div class="tbar__pista"><i style="width:${t.caida ? 100 : pct}%"></i></div>
      <span class="tbar__txt">${esc(texto)}</span>
    </div>`;
}

// --- Créditos de las APIs ---------------------------------------------
// Al pie, discreto. Se leen de la última respuesta de cada proveedor, así
// que consultarlos no gasta nada. Sirve para no enterarte de que se
// agotaron cuando /sonadoras deja de andar.
let _ultimoCreditos = 0;

async function mostrarCreditos(){
  // Cada 5 minutos alcanza: no cambian a cada refresco de la página.
  if (Date.now() - _ultimoCreditos < 300000) return;
  _ultimoCreditos = Date.now();

  try {
    const r = await fetch(`/api/creditos?k=${encodeURIComponent(KEY)}`, {cache:'no-store'});
    if (!r.ok) return;
    const d = await r.json();

    const partes = [];
    if (d.parlay != null) partes.push(`ParlayAPI ${d.parlay}`);
    if (d.theodds != null) partes.push(`respaldo ${d.theodds}`);
    if (!partes.length) return;

    // El aviso mira SOLO a ParlayAPI: es el proveedor que se usa de
    // verdad. The Odds API es el respaldo y hace rato está agotado, así
    // que si contara acá el cartel estaría siempre encendido y dejarías
    // de mirarlo justo cuando importe.
    const bajo = d.parlay != null && d.parlay < 50;

    const caja = document.getElementById('creditos');
    caja.className = 'creditos' + (bajo ? ' bajo' : '');
    caja.textContent = (bajo ? '⚠️ ' : '') + partes.join(' · ')
      + (bajo ? ' — se están agotando' : '');
    caja.hidden = false;
  } catch (e) {
    // Es un dato extra: si falla, la página sigue igual.
  }
}

// Corregir la cuota a mano: la IA no siempre la encuentra en la
// captura, y sin ella no se puede saber cuánto paga la apuesta.
async function editarCuota(id, actual){
  const valor = prompt('Cuota total de la apuesta:', actual || '');
  if (valor === null) return;

  const limpio = valor.replace(',', '.').trim();
  if (!limpio) return;
  if (isNaN(parseFloat(limpio))) { alert('Poné un número, por ejemplo 15.67'); return; }

  try {
    const r = await fetch(
      `/api/cuota?k=${encodeURIComponent(KEY)}&id=${encodeURIComponent(id)}`
      + `&cuota=${encodeURIComponent(limpio)}`, {cache:'no-store'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'error');
    await cargar();
  } catch (e) {
    alert('No pude guardar la cuota: ' + e.message);
  }
}

// Panel de administración: qué fuentes seguís, con qué filtros, y
// botón para dejar de seguir cada una. Siempre visible, independiente
// de si ya llegaron mensajes -- antes esto vivía mezclado con los
// filtros de la lista de mensajes y solo aparecía si había más de una
// fuente CON mensajes propios: recién seguida una fuente, no se veía
// en ningún lado hasta que algo le llegara.
async function renderPanelFuentes(){
  const panel = document.getElementById('panelFuentes');
  panel.innerHTML = '<p class="foot">Cargando fuentes…</p>';

  try {
    const r = await fetch(`/api/fuentes?k=${encodeURIComponent(KEY)}`, {cache:'no-store'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'error');
    _fuentes = d.fuentes || [];
  } catch (e) {
    panel.innerHTML = `<p class="foot">No pude traer las fuentes: ${esc(e.message)}</p>`;
    return;
  }

  if (!_fuentes.length) {
    panel.innerHTML = `<p class="foot">
      No estás siguiendo ninguna fuente todavía. Reaccioná a un mensaje
      con ⭐ 🔥 ✅ 👍, o usá <code>/fuentes add</code> en Telegram.
    </p>`;
    return;
  }

  panel.innerHTML = `
    <div class="panel-fuentes">
      <div class="panel-fuentes__head" onclick="toggleFuentes()">
        <b>Siguiendo (${_fuentes.length})</b>
        <span id="flechaFuentes">▸</span>
      </div>
      <div id="listaFuentes" class="panel-fuentes__lista" style="display:none">
        ${_fuentes.map(f => {
          const porReaccion = !!f.solo_apuestas && !!f.autor_ids;
          const filtros = porReaccion ? 'con foto o link' : _describirFiltros(f);
          const sinFiltro = filtros.startsWith('⚠️');

          if (porReaccion) {
            // Una persona por línea, cada una con su propia × -- antes
            // se guardaban todos juntos en un solo texto y para sacar
            // a uno solo no había otra opción que dejar de seguir a
            // todos.
            const personas = f.autor_ids.split(',').map(par => {
              const [id, ...resto] = par.split(':');
              return {id, nombre: resto.join(':') || `id ${id}`};
            });
            return `
            <div class="fuente-row fuente-row--grupo">
              <div class="fuente-row__cabecera">
                <span class="fuente-row__grupo">en @${esc(f.grupo)} · por reacción ⭐</span>
                <button class="fuente-row__quitar-chica" onclick="dejarFuente('${esc(f.nombre)}')">
                  Dejar de seguir a todos
                </button>
              </div>
              <span class="fuente-row__filtros">${esc(filtros)}</span>
              <div class="autor-chips">
                ${personas.map(p => `
                  <span class="autor-chip">
                    ${esc(p.nombre)}
                    <i onclick="quitarAutor('${esc(f.grupo)}', '${esc(p.id)}', '${esc(p.nombre)}')">×</i>
                  </span>`).join('')}
              </div>
            </div>`;
          }

          return `
          <div class="fuente-row">
            <div class="fuente-row__info">
              <b>${esc(f.nombre)}</b>
              <span class="fuente-row__grupo">@${esc(f.grupo)}</span>
              <span class="fuente-row__filtros${sinFiltro ? ' fuente-row__filtros--alerta' : ''}">${esc(filtros)}</span>
            </div>
            <button class="fuente-row__quitar" onclick="dejarFuente('${esc(f.nombre)}')">
              Dejar de seguir
            </button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function _describirFiltros(f){
  const partes = [];
  if (f.autores) partes.push(`autor: ${f.autores}`);
  if (f.solo_apuestas) partes.push('foto o link (auto)');
  if (f.requiere_foto) partes.push('con foto');
  if (f.requiere_link) partes.push('con link');
  if (f.palabras) partes.push(`palabras: ${f.palabras}`);
  if (f.casas) partes.push(`casas: ${f.casas}`);
  return partes.length ? partes.join(' · ') : '⚠️ sin filtros — pasa TODO el grupo';
}

function toggleFuentes(){
  const lista = document.getElementById('listaFuentes');
  const flecha = document.getElementById('flechaFuentes');
  const colapsado = lista.style.display === 'none';
  lista.style.display = colapsado ? '' : 'none';
  flecha.textContent = colapsado ? '▾' : '▸';
}

// Convierte URLs sueltas en el texto en links clickeables. Se hace
// DESPUÉS de escapar el texto (esc ya corrió), así que es seguro
// insertar el <a> acá sin abrir la puerta a HTML inyectado.
function enlazar(textoEscapado){
  return textoEscapado.replace(
    /(https?:\/\/[^\s<]+|(?:www\.|t\.me\/)[^\s<]+)/g,
    (m) => {
      const href = m.startsWith('http') ? m : `https://${m}`;
      return `<a href="${href}" target="_blank" rel="noopener">${m}</a>`;
    }
  );
}

function filtrarFuente(origen, btn){
  document.querySelectorAll('.ftag').forEach(b => b.classList.remove('activa'));
  btn.classList.add('activa');
  document.querySelectorAll('.msg').forEach(m => {
    m.hidden = origen !== null && m.dataset.origen !== origen;
  });
}

async function borrarMensaje(id, btn){

  btn.disabled = true;
  try {
    const r = await fetch(
      `/api/mensajes-accion?k=${encodeURIComponent(KEY)}&accion=mensaje&id=${id}`,
      {cache:'no-store'});

    btn.closest('.msg').remove();
  } catch (e) {
    btn.disabled = false;
    alert('No se pudo borrar.');

}

// Vacía los mensajes guardados. NO toca las fuentes -- seguís
// siguiendo lo mismo, solo se limpia lo acumulado hasta ahora.
async function borrarTodosLosMensajes(){

  try {
    const r = await fetch(
      `/api/mensajes-accion?k=${encodeURIComponent(KEY)}&accion=todos`,

// Borra lo guardado de esa fuente y deja de seguirla. Se pide el grupo
// aparte porque el nombre visible y el @grupo pueden diferir.
async function dejarFuente(origen){
  const fuente = (_fuentes || []).find(f => f.nombre === origen);
  const grupo = fuente ? fuente.grupo : '';
  if (!confirm(`¿Borrar los mensajes de "${origen}"`
      + (grupo ? ` y dejar de seguir @${grupo}?` : '?'))) return;

  try {
    const r = await fetch(
      `/api/mensajes-accion?k=${encodeURIComponent(KEY)}&accion=fuente`
      + `&origen=${encodeURIComponent(origen)}&grupo=${encodeURIComponent(grupo)}`,
      {cache:'no-store'});
    if (!r.ok) throw new Error('no se pudo');
    _mensajesCargados = false;
    await cargarMensajes();
  } catch (e) {
    alert('No se pudo.');
  }
}

// Saca a UNA sola persona de un grupo con varias seguidas, sin tocar a
// las demás. Si era la última, el propio backend deja de seguir el
// grupo entero (no tiene sentido un filtro "solo apuestas" sin nadie
// a quien aplicarle).
async function quitarAutor(grupo, autorId, nombre){
  if (!confirm(`¿Dejar de seguir a "${nombre}"?`)) return;
  try {
    const r = await fetch(
      `/api/mensajes-accion?k=${encodeURIComponent(KEY)}&accion=autor`
      + `&grupo=${encodeURIComponent(grupo)}&autor_id=${encodeURIComponent(autorId)}`,
      {cache:'no-store'});
    if (!r.ok) throw new Error('no se pudo');
    await renderPanelFuentes();
  } catch (e) {
    alert('No se pudo.');
  }
}

function toggleTicket(el){

}

function animar(){
  document.querySelectorAll('.leg').forEach((el, i) => {
    const pct = Math.max(0, Math.min(100, +el.dataset.pct || 0));
    const pctBurbuja = Math.min(pct, 97);
    setTimeout(() => {
      el.querySelector('.fill').style.width = pct + '%';
      el.querySelector('.bubble').style.left = pctBurbuja + '%';
    }, 80 * i);
  });
}

async function cargar(){
  try{
    const r = await fetch(`/api/bets?k=${encodeURIComponent(KEY)}`, {cache:'no-store'});
    if(r.status === 401){
      app.innerHTML = '<div class="empty"><b>Clave incorrecta</b>Revisá el enlace que usaste para entrar.</div>';
      foot.textContent = '';
      return;
    }
    if(!r.ok) throw new Error('HTTP ' + r.status);

    const data = await r.json();
    if(!data.tickets || !data.tickets.length){
      app.innerHTML = '<div class="empty"><b>Todavía no hay apuestas</b>'
        + 'Subí una captura con el botón de arriba, o mandásela al bot en Telegram.</div>';
      foot.textContent = '';
      // Sin esto quedaba el resumen de la carga anterior: la cabecera
      // seguía diciendo "3 de 9 tramos" con la lista ya vacía.
      actualizarCabecera(null);
      cargarCalibracion();
      return;
    }

    const n = data.tickets.length;
    app.innerHTML = data.tickets.map((t, i) => ticket(t, i, n)).join('');
    actualizarCabecera(data.resumen);
    cargarCalibracion();
    animar();

    const hora = new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
    foot.textContent = `Actualizado ${hora} · se refresca solo`;
    mostrarCreditos();
  }catch(e){
    // Un error de red no debe borrar lo que ya se está mostrando.
    foot.textContent = 'Sin conexión con el servidor — reintentando';
  }
}

cargar();
setInterval(cargar, REFRESCO_MS);
// Al volver a la pantalla, refrescamos enseguida en vez de esperar el ciclo
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) cargar();
});
</script>
</body>
</html>
